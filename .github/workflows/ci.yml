name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: CF Workers (TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate version files
        run: pnpm exec tsx scripts/generate-version.ts

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Format check (oxfmt)
        run: pnpm format:check

      - name: Fast type check (tsgo)
        run: pnpm typecheck:fast
        continue-on-error: true

      - name: Safe type check (tsc)
        run: pnpm typecheck:safe

      - name: Test
        run: pnpm test

  deploy-dev:
    name: Deploy (dev)
    if: github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/v') && (contains(github.ref, '-pre') || contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-snapshot') || contains(github.ref, '-nightly') || contains(github.ref, '-canary') || contains(github.ref, '-dev')))
    needs: [test]
    runs-on: ubuntu-latest
    concurrency: dev-deploy
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Deploy dev stage (alchemy)
        run: pnpm deploy:dev
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          API_SECRET: ${{ secrets.API_SECRET }}

  deploy-prod:
    name: Deploy CF Workers (prod)
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-pre') && !contains(github.ref, '-rc') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') && !contains(github.ref, '-snapshot') && !contains(github.ref, '-nightly') && !contains(github.ref, '-canary') && !contains(github.ref, '-dev')
    needs: [test]
    runs-on: ubuntu-latest
    concurrency: prod-deploy
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Deploy prod stage (alchemy, --adopt)
        run: pnpm deploy:prod
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          API_SECRET: ${{ secrets.API_SECRET }}
